name: loads-agent

# Hourly headless-browser agent per source (plan amendment #1 — was */15,
# tightened to 0 * * * * so the ToS exposure on gated boards stays modest).
# Each source runs in its own matrix job; a stuck Chromium can't block the
# others. The sidecar + agent live inside this job — the FastAPI backend
# on Render only sees the tool-loop over HTTP.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "One source to run (empty = all)"
        required: false
        default: ""

concurrency:
  group: loads-agent-${{ github.event.inputs.source || 'all' }}
  # cancel-in-progress: false — a running agent must not be interrupted mid-tool-call.
  cancel-in-progress: false

jobs:
  run:
    if: github.event.inputs.source == '' || github.event.inputs.source == matrix.src
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        src: [dat, truckstop, loadboard123, chr, broker_page]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-pw-chromium-v1

      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e . || pip install -r requirements.txt || true
          pip install playwright httpx fastapi uvicorn

      - name: Install Chromium
        run: python -m playwright install chromium

      - name: Pull session blob
        env:
          API_BASE: ${{ secrets.API_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          mkdir -p /tmp/sessions
          curl -sS -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/loads/sources/${{ matrix.src }}/session" \
            > /tmp/sessions/${{ matrix.src }}.resp.json || true

      - name: Start sidecar
        working-directory: backend
        run: |
          nohup python -m uvicorn app.integrations.adapters.loadboard.agent_browser.service:app \
            --host 127.0.0.1 --port 8765 --log-level warning >/tmp/sidecar.log 2>&1 &
          for i in {1..30}; do
            curl -sfS http://127.0.0.1:8765/health && break
            sleep 1
          done

      - name: Trigger run
        env:
          API_BASE: ${{ secrets.API_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            "$API_BASE/loads/sources/${{ matrix.src }}/refresh"

      - name: Push session blob
        if: always()
        env:
          API_BASE: ${{ secrets.API_BASE }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -f /tmp/sessions/${{ matrix.src }}.save.json || exit 0
          curl -sS -X POST -H "X-Cron-Secret: $CRON_SECRET" \
            -H 'content-type: application/json' \
            --data @/tmp/sessions/${{ matrix.src }}.save.json \
            "$API_BASE/loads/sources/${{ matrix.src }}/session"

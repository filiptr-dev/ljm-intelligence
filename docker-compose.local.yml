# LOCAL OVERRIDE — gitignored (.env.local-docker supplies secrets).
# Extends docker-compose.yml for the all-in-one local dev stack.
# Run with:
#   COMPOSE_PROJECT_NAME=ljm-local docker compose -f docker-compose.yml -f docker-compose.local.yml --env-file .env.local-docker up -d
#
# Why a separate override file: keeps prod docker-compose.yml clean of local-only
# settings (host ports, frontend service, dev env vars) — a habit that prevents
# "works locally, different on Render" drift. The override is additive; compose
# merges it with the base at runtime.

services:
  postgres:
    env_file: .env.local-docker
    ports:
      - "5460:5432"

  api:
    env_file:
      - .env.local-docker
      # backend/.env carries GEMINI_API_KEY and other AI keys.
      # The explicit DATABASE_URL / DATABASE_URL_DIRECT in environment: below
      # take precedence over anything in this file, so the deleted Neon URL
      # that backend/.env may contain cannot reach the container.
      - backend/.env
    environment:
      DATABASE_URL: postgresql://ljm:ljm@postgres:5432/ljm
      DATABASE_URL_DIRECT: postgresql://ljm:ljm@postgres:5432/ljm
      CORS_ALLOWED_ORIGINS: "http://localhost:3001"
    # Use explicit venv paths so the CMD works regardless of how the shell sources PATH
    command: sh -c "/app/.venv/bin/alembic upgrade head && exec /app/.venv/bin/uvicorn app.main:create_app --factory --host 0.0.0.0 --port \"$$PORT\" --proxy-headers --forwarded-allow-ips='*'"
    ports:
      - "8001:8000"

  worker:
    env_file: .env.local-docker
    environment:
      DATABASE_URL: postgresql://ljm:ljm@postgres:5432/ljm
      DATABASE_URL_DIRECT: postgresql://ljm:ljm@postgres:5432/ljm
    command: sh -c "/app/.venv/bin/python3 -m procrastinate --app=app.shared.queue.app worker --queues=default"

  agent-browser:
    environment:
      AGENT_BROWSER_TOKEN: "${AGENT_BROWSER_TOKEN:-}"
    ports:
      - "8081:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.local-docker
      # backend/.env carries CRON_SECRET (same source the `api` service reads
      # from above). The frontend's "Start now" POST signs itself with
      # CRON_SECRET and the api compares them — they MUST come from the same
      # file. The previous `CRON_SECRET: "${CRON_SECRET:-}"` override under
      # `environment:` silently blanked the value whenever compose ran without
      # that shell var exported, which is why Start now returned
      # "invalid cron secret". Dropping the override + reading backend/.env
      # keeps the two services in lockstep by construction.
      - backend/.env
    environment:
      # API_URL is the server-side base URL read by client.ts and the proxy/login
      # BFF routes (process.env.API_URL || process.env.NEXT_PUBLIC_API_URL).
      # Without this, Next.js server code falls back to NEXT_PUBLIC_API_URL
      # (http://localhost:8001) which resolves to the frontend container itself,
      # not the api service — causing 502s on every server-rendered page.
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8001
      # CI=true prevents pnpm from asking for TTY confirmation when
      # it detects a mismatch between container node_modules and lockfile.
      CI: "true"
    depends_on:
      - api
    ports:
      - "3001:3000"

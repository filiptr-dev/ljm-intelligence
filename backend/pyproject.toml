[project]
name = "ljm-intelligence-api"
version = "0.1.0"
description = "LJM Intelligence backend: real lead crawler, Gemini scoring, outreach"
authors = [
    { name = "Filip Trajanovikj", email = "filiptrajanovik@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "anthropic>=0.40",
    "argon2-cffi>=23.1",
    "asyncpg>=0.31.0",
    "cryptography>=50.0.2",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.59.1",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "trafilatura>=1.12",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "import-linter>=2.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "-m", "not perf"]
markers = [
    "live: requires DATABASE_URL to a real Postgres (Neon)",
    "perf: slow performance benchmarks — opt-in via `pytest -m perf`",
]

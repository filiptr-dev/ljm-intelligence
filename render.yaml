# Render Blueprint for the LJM Intelligence API. Frontend deploys on Vercel.
services:
  - type: web
    name: ljm-intelligence-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Neon pooled URL, keep sslmode=require & channel_binding=require.
      - key: DATABASE_URL
        sync: false
      # Neon DIRECT (non-pooler) URL — the worker + Alembic use this
      # because the pooler doesn't support LISTEN/NOTIFY. See docs/ops.md.
      - key: DATABASE_URL_DIRECT
        sync: false
      # S0.2 — seed owner password for migration 0008. Production refuses
      # to run the migration without this env var set.
      - key: SEED_OWNER_PASSWORD
        sync: false
      # MF2 — shared secret with the Vercel Next BFF (`LJM_PROXY_SECRET`
      # on Vercel). Lets the backend trust the Vercel-forwarded real
      # client IP so the per-IP login rate limiter doesn't collapse every
      # user into one bucket.
      - key: TRUSTED_PROXY_SECRET
        sync: false
      # 1 = Render alone. Bump to 2 behind Cloudflare → Render.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      # MF1 — in-process bounded drain after on-demand user triggers.
      # True on free Render (no worker service); False once an always-on
      # worker container runs on the user's infra.
      - key: JOBS_IN_PROCESS_KICK_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEX
        sync: false
      # Gemini — model names env-driven; SDK gets picked up from these.
      - key: GEMINI_API_KEY
        sync: false
      # Anthropic (ai-provider-layer-claude). Missing key → Claude-routed features
      # fall back to NullProvider (`status="no_api_key"`), never a 500. Set in the
      # Render dashboard; `sync: false` keeps it out of the blueprint.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_DEFAULT_MODEL
        value: claude-sonnet-5-5
      - key: CLAUDE_CHEAPER_MODEL
        value: claude-haiku-4-5-20251001
      # Model IDs are env-driven. Default is gemini-3.5-flash-lite (cheapest quota).
      # Override in the Render dashboard without a redeploy when Google rotates models.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_SCORING
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_DISCOVERY
        value: gemini-3.5-flash-lite
      # OSM Overpass ingest — bound the per-crawl state count so each run stays short.
      # With 32 states × 2s throttle + 30s timeout, an unbounded run could exceed 20 min.
      # 8 states = ~16s throttle time minimum (worst-case ~4 min). Increase if full coverage needed.
      - key: OSM_OVERPASS_MAX_STATES
        value: "8"
      # FMCSA paginator (crawl-depth plan 2026-09-30). Defaults are already sensible;
      # values below match Settings defaults so ops can see them in the dashboard.
      # FMCSA_APP_TOKEN lifts SODA off the shared throttle bucket (optional; leave unset for keyless).
      - key: FMCSA_APP_TOKEN
        sync: false
      - key: FMCSA_PAGE_SIZE
        value: "500"
      # Steady-state cap: ~3000 rows/run.
      - key: FMCSA_PER_RUN_PAGE_CAP
        value: "6"
      # First-run backfill cap (no frontier yet): ~20 000 rows / ~1yr of B/S/F registrations.
      - key: FMCSA_BACKFILL_PAGE_CAP
        value: "40"
      # Soft wall-clock cap; paginator finishes current page then stops with stopped_reason=timeout.
      - key: FMCSA_TIME_BUDGET_S
        value: "120"
      # Shared secret with the GitHub Actions cron.
      - key: CRON_SECRET
        sync: false
      # Sentry — optional. Unset = SDK not initialised (dev/CI stay offline).
      # Events are tagged with tenant_id + request_id from the shared contextvars.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.0"
      - key: FRONTEND_ORIGIN
        sync: false
      # Demo safety net — flip to false only when real send is deliberately enabled.
      - key: SIMULATED_DELIVERY
        value: "true"
      - key: OUTREACH_FROM_EMAIL
        value: safety@ljminternational.com
      - key: OUTREACH_FROM_NAME
        value: LJM International
      - key: OUTREACH_POSTAL_ADDRESS
        value: "22 Troy Lane, Lincoln Park NJ 07035"
      # LLM enrichment scraper (plan 2026-09-30-llm-scraper).
      - key: ENRICHMENT_ENABLED
        value: "true"
      - key: ENRICHMENT_PER_RUN_CAP
        value: "10"          # quota-safe: ≤10 site-scrapes + ≤10 LinkedIn-search calls per crawl
      - key: ENRICHMENT_PAGE_CAP_PER_COMPANY
        value: "8"
      - key: ENRICHMENT_REQUEST_TIMEOUT_S
        value: "15"
      - key: ENRICHMENT_BETWEEN_REQUESTS_S
        value: "1.5"
      - key: ENRICHMENT_CACHE_TTL_HOURS
        value: "24"
      - key: DISCOVERY_PER_RUN_CAP
        value: "8"
      - key: GEMINI_MODEL_ENRICHMENT
        value: gemini-3.5-flash-lite
      # Auto-outreach — OFF by default. Compliance rules enforced in code.
      # Unsubscribe footer is always appended to every email. Its base URL
      # defaults in code to https://ljm-intelligence-api.onrender.com; set this
      # only to override it (e.g. a custom domain).
      - key: UNSUBSCRIBE_BASE_URL
        sync: false
      # HMAC-SHA256 secret for unsubscribe tokens. Without this the unsubscribe
      # route hard-400s — a misconfigured deploy can never mass-unsubscribe by
      # URL enumeration.
      - key: UNSUBSCRIBE_SECRET
        sync: false
      # ---- Mail connector (plan 2026-10-01-google-workspace-mail-connector)
      # Default is simulated. Values are set in the Render dashboard, not git.
      - key: MAIL_SENDER
        value: simulated
      - key: MAILBOX_SOURCE
        value: simulated
      - key: MAIL_OWNER_SEND_ENABLED
        value: "false"
      - key: GMAIL_SA_JSON
        sync: false
      - key: GMAIL_IMPERSONATE
        value: contact@ljminternational.com
      - key: GMAIL_ADMIN_IMPERSONATE
        sync: false
      - key: GMAIL_PER_MAILBOX_RPS
        value: "2"
      - key: GMAIL_GLOBAL_RPS
        value: "20"
      - key: GMAIL_BACKOFF_MAX_SECONDS
        value: "60"
      # ---- Load-board connectors (plan 2026-10-01-load-board-connectors)
      # All env-gated; absent = disabled.
      - key: DAT_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: DAT_SERVICE_ACCOUNT_PASSWORD
        sync: false
      - key: DAT_ORG_ID
        sync: false
      - key: CHR_CLIENT_ID
        sync: false
      - key: CHR_CLIENT_SECRET
        sync: false
      - key: CHR_CARRIER_CODE
        sync: false
      - key: LB123_API_KEY
        sync: false
      - key: LB123_CARRIER_USERNAME
        sync: false
      - key: LB123_CARRIER_PASSWORD
        sync: false
      - key: TRUCKSTOP_INTEGRATION_ID
        sync: false
      - key: TRUCKSTOP_USERNAME
        sync: false
      - key: TRUCKSTOP_PASSWORD
        sync: false

# Render Blueprint for the LJM Intelligence API. Frontend deploys on Vercel.
services:
  - type: web
    name: ljm-intelligence-api
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/**
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Neon pooled URL, keep sslmode=require & channel_binding=require.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEX
        sync: false
      # Gemini — model names env-driven; SDK gets picked up from these.
      - key: GEMINI_API_KEY
        sync: false
      # Model IDs are env-driven. Default is gemini-3.5-flash-lite (cheapest quota).
      # Override in the Render dashboard without a redeploy when Google rotates models.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_SCORING
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_DISCOVERY
        value: gemini-3.5-flash-lite
      # OSM Overpass ingest — bound the per-crawl state count so each run stays short.
      # With 32 states × 2s throttle + 30s timeout, an unbounded run could exceed 20 min.
      # 8 states = ~16s throttle time minimum (worst-case ~4 min). Increase if full coverage needed.
      - key: OSM_OVERPASS_MAX_STATES
        value: "8"
      # Shared secret with the GitHub Actions cron.
      - key: CRON_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      # Demo safety net — flip to false only when real send is deliberately enabled.
      - key: SIMULATED_DELIVERY
        value: "true"
      - key: OUTREACH_FROM_EMAIL
        value: safety@ljminternational.com
      - key: OUTREACH_FROM_NAME
        value: LJM International
      - key: OUTREACH_POSTAL_ADDRESS
        value: "22 Troy Lane, Lincoln Park NJ 07035"
